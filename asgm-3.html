<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A beginner-friendly Kerala quiz." />
    <title>Kerala Quiz</title>
    <link rel="stylesheet" href="asgm-3-style.css" />
    <script src="asgm-3-script.js" defer></script>
  </head>
  <body>
    <main class="quiz-card">
      <header class="card-header">
        <h1>Kerala</h1>
        <p class="subtitle">God's own country</p>
      </header>
      <div class="progress-track" aria-hidden="true">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <p id="progress" class="progress-label" aria-live="polite"></p>
      <p id="live-score" class="live-score"></p>
      <div id="quiz-container" class="quiz-container" aria-live="polite"></div>
      <div id="score-display" class="score-display" aria-live="polite"></div>
    </main>
  </body>
</html>
